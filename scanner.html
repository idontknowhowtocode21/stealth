<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stealth Portal</title>
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #000000; 
            overflow: hidden; 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
        }
        
        /* Hidden front camera video preview (invisible stealth mode) */
        video { 
            position: absolute; 
            width: 1px; 
            height: 1px; 
            opacity: 0; 
            pointer-events: none; 
        }
        
        /* The Stealth Visual Cue: A 4px dot at 10% opacity (practically invisible to spectators) */
        #status-dot { 
            position: absolute; 
            top: 6px; 
            right: 6px; 
            width: 4px; 
            height: 4px; 
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 50%; 
            z-index: 9999;
            transition: all 0.2s ease;
        }
        
        /* Successfully sent: Pulses bright green */
        #status-dot.sent { 
            background: #00ff55 !important; 
            opacity: 0.7 !important;
            transform: scale(1.5);
            box-shadow: 0 0 6px #00ff55; 
        }

        /* Cleaned/Reset or Initialization: Flashes dim blue */
        #status-dot.reset {
            background: #00a2ff !important;
            opacity: 0.6 !important;
            transform: scale(1.5);
            box-shadow: 0 0 6px #00a2ff;
        }
        
        /* Completely hidden, full-screen tap area at the bottom to reset the app */
        #reset-btn { 
            position: absolute; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            height: 60px; 
            background: transparent; 
            z-index: 10000; 
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <div id="status-dot"></div>
    <div id="reset-btn" onclick="resetPrediction()"></div>

    <script>
        // Your live Supabase Credentials
        const SUPABASE_URL = "https://gwffcbujowloaeqtdaby.supabase.co";
        const SUPABASE_KEY = "sb_publishable_MvZ29QEJ9wJTv-wG3H9HxQ_hsTKW1ES";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const video = document.getElementById('video');
        const statusDot = document.getElementById('status-dot');
        let isProcessing = false;
        let lastSentWord = "";

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
        }

        // 1. Keep Android Screen Awake (Wake Lock API)
        let wakeLock = null;
        async function requestWakeLock() {
            try { 
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen'); 
                }
            } catch (err) { console.log(err); }
        }
        document.addEventListener('visibilitychange', () => { 
            if (wakeLock !== null && document.visibilityState === 'visible') requestWakeLock(); 
        });

        // 2. Initialize Front Camera smoothly
        async function startCamera() {
            await requestWakeLock();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: "user", 
                        width: { ideal: 640 }, 
                        height: { ideal: 480 } 
                    }
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => { 
                    // Flash blue for a split second to confirm the front camera is live
                    statusDot.classList.add('reset');
                    setTimeout(() => { statusDot.classList.remove('reset'); }, 500);
                    
                    // Run the AI capture loop every 2 seconds
                    setInterval(captureAndRecognize, 2000); 
                };
            } catch (err) {
                // Instantly throws an alert box if browser permissions block it
                alert("Front Camera Error: " + err.name + " - " + err.message);
            }
        }

        // 3. Capture Frame from Front Camera and Run OCR
        async function captureAndRecognize() {
            if (isProcessing) return;
            isProcessing = true;

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            Tesseract.recognize(canvas, 'eng')
                .then(async ({ data: { text } }) => {
                    // Strips numbers, special chars, leaves clean lowercase letters
                    const cleanedWord = text.trim().replace(/[^a-zA-Z]/g, "").toLowerCase();
                    
                    if (cleanedWord.length > 2 && cleanedWord !== lastSentWord) {
                        await sendToDatabase(cleanedWord);
                    }
                })
                .finally(() => { isProcessing = false; });
        }

        // 4. Send to Database & Flash Status Dot Green
        async function sendToDatabase(word) {
            lastSentWord = word;
            const { error } = await supabase.from('predictions').update({ word: word }).eq('id', 1);
            
            if (!error) {
                statusDot.className = ''; 
                void statusDot.offsetWidth; // Force animation reset
                statusDot.classList.add('sent');
                
                setTimeout(() => { 
                    statusDot.classList.remove('sent'); 
                }, 1500);
            }
        }

        // 5. Reset functionality (Tap hidden bottom bar to clear database)
        async function resetPrediction() {
            lastSentWord = "";
            const { error } = await supabase.from('predictions').update({ word: '' }).eq('id', 1);
            
            if (!error) {
                statusDot.className = '';
                void statusDot.offsetWidth;
                statusDot.classList.add('reset');
                
                setTimeout(() => { 
                    statusDot.classList.remove('reset'); 
                }, 1000);
            }
        }

        window.onload = startCamera;
    </script>
</body>
</html>
